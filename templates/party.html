{% extends "base.html" %}

{% block content %}

<section class="page-head">

    <span class="eyebrow">
        Planner 02
    </span>

    <h1>
        Party Budget Planner
    </h1>

    <p>
        Allocate your event budget
        across food, venue,
        decoration and contingency.
    </p>

</section>


<div class="planner-layout">

    <form
        class="card planner-form"
        id="partyForm"
    >

        <label>

            Total Budget (₹)

            <input
                type="number"
                name="budget"
                min="1"
                required
                placeholder="50000"
            >

        </label>


        <label>

            Guests

            <input
                type="number"
                name="guests"
                min="1"
                required
                placeholder="50"
            >

        </label>


        <label>

            Event Type

            <select name="event_type">

                <option>
                    Birthday
                </option>

                <option>
                    Wedding
                </option>

                <option>
                    Corporate
                </option>

                <option>
                    Anniversary
                </option>

                <option>
                    Other
                </option>

            </select>

        </label>


        <label>

            Venue Preference

            <input
                name="venue_preference"
                value="Flexible"
            >

        </label>


        <label>

            City

            <input
                name="city"
                value="Chennai"
            >

        </label>


        <button
            class="btn primary"
            type="submit"
        >
            Generate Plan
        </button>


        <div
            class="form-message"
            id="message"
        ></div>

    </form>


    <div
        class="card result"
        id="result"
    >

        <div class="empty">
            Your party plan will
            appear here.
        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>
    bindPartyForm();
</script>

{% endblock %}
