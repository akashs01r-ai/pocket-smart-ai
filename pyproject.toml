[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsmart-ai"
version = "0.1.0"
description = "A local-first budget and recommendation assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1,<4",
    "PyJWT>=2.8,<3",
    "google-genai>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]
